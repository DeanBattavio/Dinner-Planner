<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Dinner Planner</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="max-w-xl w-full bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-800">
    <div class="flex items-center justify-between mb-2">
      <h1 class="text-2xl sm:text-3xl font-bold text-emerald-400">Smart Dinner Planner</h1>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-medium">AI Chef</span>
    </div>
    <p class="text-slate-400 text-sm sm:text-base mb-6">Enter what's in the fridge to get 3 instant dinner recipes and a grocery list.</p>
    
    <label class="block text-sm font-medium text-slate-300 mb-1.5">Ingredients on hand</label>
    <textarea id="ingredients" rows="3" placeholder="e.g., chicken breast, rice, broccoli, cheddar cheese..." class="w-full p-3.5 rounded-xl bg-slate-950 border border-slate-800 mb-4 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition"></textarea>
    
    <label class="block text-sm font-medium text-slate-300 mb-1.5">Dietary notes (optional)</label>
    <input id="diet" type="text" placeholder="e.g., high protein, healthy, under 30 mins" class="w-full p-3.5 rounded-xl bg-slate-950 border border-slate-800 mb-6 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition" />
    
    <button onclick="generate()" id="btn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20">Generate Dinner Ideas</button>
    
    <div id="resultBox" class="mt-6 hidden">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Your Dinner Plan</span>
        <button onclick="copyText()" id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 px-3 py-1.5 rounded-lg transition">Copy Plan</button>
      </div>
      <div id="output" class="whitespace-pre-wrap text-slate-200 text-sm sm:text-base leading-relaxed bg-slate-950 p-5 rounded-xl border border-slate-800"></div>
    </div>
  </div>

  <script>
    async function generate() {
      const btn = document.getElementById('btn');
      const resultBox = document.getElementById('resultBox');
      const output = document.getElementById('output');
      const ingredients = document.getElementById('ingredients').value.trim();
      const diet = document.getElementById('diet').value.trim();

      if (!ingredients) {
        alert('Type some ingredients first!');
        return;
      }

      btn.innerText = 'Chef AI is cooking up ideas...';
      btn.disabled = true;
      resultBox.classList.remove('hidden');
      output.innerText = 'Checking your fridge and building recipes...';

      try {
        const res = await fetch('/api/plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ingredients: ingredients, diet: diet })
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          output.innerText = 'Server Error (' + res.status + '): Please wait 15 seconds for Vercel to finish updating and refresh.';
          return;
        }
        output.innerText = data.result || data.error || 'Something went wrong.';
      } catch (err) {
        output.innerText = 'Connection failed: ' + err.message;
      } finally {
        btn.innerText = 'Generate Dinner Ideas';
        btn.disabled = false;
      }
    }

    function copyText() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = 'Copied!';
      setTimeout(function() { copyBtn.innerText = 'Copy Plan'; }, 2000);
    }
  </script>
</body>
</html>
