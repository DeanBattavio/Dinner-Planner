<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chef Dean - Smart Dinner Planner</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-950 via-blue-900 to-indigo-950 text-white font-bold min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden">
  
  <!-- Subtle Floating Food Background -->
  <div class="fixed inset-0 pointer-events-none select-none overflow-hidden opacity-15 text-5xl sm:text-6xl z-0">
    <span class="absolute top-8 left-8 -rotate-12">🍕</span>
    <span class="absolute top-16 right-12 rotate-12">🥗</span>
    <span class="absolute top-1/3 left-6 rotate-6">🍗</span>
    <span class="absolute top-1/2 right-8 -rotate-12">🍝</span>
    <span class="absolute bottom-24 left-12 rotate-12">🥑</span>
    <span class="absolute bottom-12 right-14 -rotate-6">🌮</span>
    <span class="absolute top-1/4 left-1/3 rotate-12">🧀</span>
    <span class="absolute bottom-1/3 right-1/4 -rotate-12">🥦</span>
  </div>

  <!-- Main App Card -->
  <div class="max-w-xl w-full bg-blue-950/85 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl border-2 border-blue-400/30 relative z-10">
    <div class="flex items-center justify-between mb-3">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-sky-300">Smart Dinner Planner</h1>
      <span class="text-xs sm:text-sm bg-sky-400 text-blue-950 px-3 py-1 rounded-full font-extrabold shadow-md">👨‍🍳 Chef Dean</span>
    </div>
    <p class="text-blue-100 text-sm sm:text-base font-semibold mb-6">Enter what's in the fridge to get 3 instant dinner recipes and a grocery list from Chef Dean.</p>
    
    <label class="block text-sm font-extrabold uppercase tracking-wide text-sky-200 mb-1.5">Ingredients on hand</label>
    <textarea id="ingredients" rows="3" placeholder="e.g., chicken breast, rice, broccoli, cheddar cheese..." class="w-full p-3.5 rounded-xl bg-blue-900/70 border-2 border-blue-400/30 mb-4 text-white font-bold placeholder-blue-300/60 focus:outline-none focus:border-sky-300 transition"></textarea>
    
    <label class="block text-sm font-extrabold uppercase tracking-wide text-sky-200 mb-1.5">Dietary notes (optional)</label>
    <input id="diet" type="text" placeholder="e.g., high protein, healthy, under 30 mins" class="w-full p-3.5 rounded-xl bg-blue-900/70 border-2 border-blue-400/30 mb-6 text-white font-bold placeholder-blue-300/60 focus:outline-none focus:border-sky-300 transition" />
    
    <button onclick="generate()" id="btn" class="w-full bg-sky-400 hover:bg-sky-300 text-blue-950 font-extrabold text-base sm:text-lg py-3.5 rounded-xl transition shadow-lg shadow-sky-400/25">Ask Chef Dean for Dinner Ideas</button>
    
    <div id="resultBox" class="mt-6 hidden">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-extrabold uppercase tracking-wider text-sky-300">Chef Dean's Dinner Plan</span>
        <button onclick="copyText()" id="copyBtn" class="text-xs bg-blue-800 hover:bg-blue-700 text-sky-200 font-extrabold px-3 py-1.5 rounded-lg border border-blue-400/30 transition">Copy Plan</button>
      </div>
      <div id="output" class="whitespace-pre-wrap text-white font-semibold text-sm sm:text-base leading-relaxed bg-blue-900/80 p-5 rounded-2xl border-2 border-blue-400/30"></div>
    </div>
  </div>

  <script>
    async function generate() {
      const btn = document.getElementById('btn');
      const resultBox = document.getElementById('resultBox');
      const output = document.getElementById('output');
      const ingredients = document.getElementById('ingredients').value.trim();
      const diet = document.getElementById('diet').value.trim();

      if (!ingredients) {
        alert('Type some ingredients first!');
        return;
      }

      btn.innerText = 'Chef Dean is cooking up ideas...';
      btn.disabled = true;
      resultBox.classList.remove('hidden');
      output.innerText = 'Chef Dean is checking your fridge and building recipes...';

      try {
        const res = await fetch('/api/plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ingredients: ingredients, diet: diet })
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          output.innerText = 'Server Error (' + res.status + '): Please wait 15 seconds for Vercel to finish updating and refresh.';
          return;
        }
        output.innerText = data.result || data.error || 'Something went wrong.';
      } catch (err) {
        output.innerText = 'Connection failed: ' + err.message;
      } finally {
        btn.innerText = 'Ask Chef Dean for Dinner Ideas';
        btn.disabled = false;
      }
    }

    function copyText() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = 'Copied!';
      setTimeout(function() { copyBtn.innerText = 'Copy Plan'; }, 2000);
    }
  </script>
</body>
</html>
